name: Test & deploy to Hostinger

# Every push to main (or "Run workflow" on the Actions tab):
#   1. run the full test suite (a failure stops everything),
#   2. build a ready-to-run copy (Composer packages without dev tools + compiled CSS/JS),
#   3. upload it to Hostinger over SSH and run deploy-hostinger.sh there (migrations, caches).
#
# Settings -> Secrets and variables -> Actions -> Secrets:
#   HOSTINGER_SSH_HOST  server IP          (hPanel -> Advanced -> SSH Access)
#   HOSTINGER_SSH_PORT  usually 65002
#   HOSTINGER_SSH_USER  e.g. u123456789
#   HOSTINGER_SSH_KEY   the PRIVATE key whose public key is added in hPanel -> SSH Access -> SSH keys
#   HOSTINGER_APP_PATH  live app folder, e.g. /home/u123456789/domains/fitnix.in/laravel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Build CSS/JS
        run: npm run build

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact

  deploy:
    name: Deploy to Hostinger
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd, zip, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Production dependencies and assets
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          npm ci
          npm run build

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-65002}" "$SSH_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host hostinger"
            echo "  HostName $SSH_HOST"
            echo "  Port ${SSH_PORT:-65002}"
            echo "  User $SSH_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  ServerAliveInterval 30"
          } >> ~/.ssh/config

      # The build goes to a fresh folder next to the app (never into the live folder directly);
      # deploy.sh then copies it in, keeping .env, storage/ (uploads, logs) and public/storage.
      - name: Upload the build
        env:
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=tests --exclude=.env \
              --exclude=public/build.zip -czf /tmp/release.tgz .
          ssh hostinger "rm -rf '$APP_PATH-release' && mkdir -p '$APP_PATH-release'"
          ssh hostinger "tar -xzf - -C '$APP_PATH-release'" < /tmp/release.tgz

      - name: Run the deploy on the server
        env:
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          ssh hostinger "DEPLOYPATH='$APP_PATH' bash '$APP_PATH-release/deploy-hostinger.sh' && rm -rf '$APP_PATH-release'"
